version: 2
updates:
  # Major versions are upgraded by hand, one at a time; Dependabot only proposes minor and patch updates. A Python
  # update must also bump the exact pins in `job_dependencies` (databricks.yml), which the jobs install.
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      python: { patterns: ["*"] }

  # Databricks Apps installs from its own npm mirror, which refuses some public packages and versions: deploy an
  # npm update to a dev workspace before merging it (CONTRIBUTING.md).
  - package-ecosystem: npm
    directory: /app/brickfill
    schedule: { interval: weekly }
    labels: [dependencies, needs-dev-deploy]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      appkit:
        patterns: ["@databricks/*"]
      npm:
        patterns: ["*"]
        exclude-patterns: ["@databricks/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }

[project]
name = "brickfill"
version = "0.2.1"
description = "Evidence-first catalog enrichment agent for Databricks"
license = "Apache-2.0"
authors = [{ name = "Pedro Ramos" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "databricks-sdk[openai]>=0.81.0,<1",
  "mcp>=1.30,<2",
  "httpx>=0.28,<1",
  "Pillow>=13,<14",
  "pydantic>=2.11,<3",
  "tenacity>=9,<10",
  "psycopg[binary]>=3.2,<4"
]

[dependency-groups]
dev = [
  "jsonschema>=4,<5",
  "PyYAML>=6,<7",
  "regex>=2024,<2027",
  "pytest>=9,<10",
  "ruff>=0.12,<1"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Databricks notebook globals
builtins = ["dbutils", "display", "spark"]

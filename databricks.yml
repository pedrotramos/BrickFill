bundle:
  name: brickfill
  databricks_cli_version: ">= 1.19.0"
  uuid: 71241bac-71fe-4685-9ac0-3f37a3f41799

experimental:
  skip_name_prefix_for_schema: true

include:
  - resources/*.yml

# FinOps: every job of the bundle carries these tags (the app and the Lakebase project receive the same values,
# see resources/lakebase.yml and the app bundle). Serverless cost is attributed through budget_policy_id.
presets:
  tags:
    project: brickfill
    environment: ${bundle.target}
    cost_center: ${var.tag_cost_center}
    owner: ${var.tag_owner}
    business_unit: ${var.tag_business_unit}

variables:
  # --- Working area: enrichment tables, views and the evidence Volumes ---
  catalog:
    description: Unity Catalog catalog where the enrichment tables are written (an existing catalog; none is created)
  schema:
    description: Unity Catalog schema where the enrichment tables are written (created by the bundle)
    default: brickfill

  # --- Source contract: an adapter maps the retailer's tables to the three canonical views (adapters/README.md) ---
  adapter:
    description: Adapter under adapters/ that builds the canonical views (mock in dev; your own in prod). "none" only validates views built elsewhere
    default: mock
  adapter_source_catalog:
    description: Catalog of the retailer's tables the adapter reads ({{source}} in the adapter SQL)
    default: ${var.catalog}
  adapter_source_schema:
    description: Schema of the retailer's tables the adapter reads ({{source}} in the adapter SQL)
    default: brickfill_source
  adapter_params:
    description: JSON object of extra adapter placeholders, e.g. {"pim":"main.pim"}; values must be identifiers
    default: "{}"
  contract_fail_on:
    description: When the contract check fails the job - error (default), warning or never
    default: error
  mock_product_count:
    description: Number of items generated by the mock-data job (dev target only)
    default: "20000"

  # --- Canonical views read by the enrichment job (created by the source_contract job) ---
  source_catalog:
    description: Catalog holding the three canonical views
    default: ${var.catalog}
  source_schema:
    description: Schema holding the three canonical views
    default: ${var.schema}
  source_products_table:
    description: Canonical products view (contract v_products)
    default: v_products
  source_attributes_table:
    description: Canonical attributes view (contract v_attributes)
    default: v_attributes
  source_attribute_options_table:
    description: Canonical attribute options view (contract v_attribute_options)
    default: v_attribute_options
  attributes_required_default:
    description: '"true" treats an attribute whose is_required is NULL as required; "false" as optional'
    default: "true"

  # --- Content: language, editorial profile and market (the app's Settings screen overrides them) ---
  content_language:
    description: Language the content is written in (en, pt-BR, es; see src/brickfill/content/locales)
    default: en
  catalog_language:
    description: Language of the retailer's attribute names and vocabularies; empty = same as content_language
    default: ""
  content_profile:
    description: Editorial profile (src/brickfill/content/profiles) - lengths, title order, fact sheet, image rules
    default: default
  market:
    description: Market pack (BR, ES, MX, US; empty = none) - regulatory bodies, localized search and scrape, marketplaces ranked last
    default: ""
  timezone_id:
    description: Time zone of the job schedules (Java time zone id, e.g. America/New_York, Europe/Madrid)
    default: UTC

  # --- Destination: Delta table kept in sync with the products approved in the app (via the publish job) ---
  destination_catalog:
    description: Catalog of the table that receives enriched products approved in the app
    default: ${var.catalog}
  destination_schema:
    description: Schema of the table that receives enriched products approved in the app
    default: ${var.schema}
  destination_table:
    description: Table that receives enriched products approved in the app
    default: enriched_products_approved

  # --- Lakebase: the serving layer of the app (resources/lakebase.yml creates the project in every target) ---
  lakebase_project_id:
    description: Lakebase project id (the last segment of projects/<id>); created by the bundle
    default: brickfill-${bundle.target}
  lakebase_branch_id:
    description: Lakebase branch the jobs and the app use
    default: production
  lakebase_endpoint_id:
    description: Read-write endpoint (compute) of the branch
    default: primary
  lakebase_endpoint:
    description: Full endpoint path the jobs connect to; derived from the three ids above
    default: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch_id}/endpoints/${var.lakebase_endpoint_id}
  lakebase_min_cu:
    description: Fewest compute units of the read-write endpoint while it is awake (1 CU is about 2 GB of RAM)
    default: 0.5
  lakebase_max_cu:
    description: Most compute units the endpoint scales up to under load (at most 16 above lakebase_min_cu)
    default: 16
  lakebase_database_name:
    description: Postgres database name inside the Lakebase branch
    default: databricks_postgres
  lakebase_schema:
    description: Postgres schema owned by the app (reviews, edits, manual evidence, audit, settings); the jobs read it
    default: brickfill_app
  lakebase_results_schema:
    description: Postgres schema owned by the load step; holds the latest enrichment of each product for the app
    default: enrichment
  app_service_principal:
    description: Client ID of the app service principal; when set, the load step grants it read access to the results schema
    default: ""
  publish_cron:
    description: Quartz cron expression of the job that publishes approved products
    default: 0 0 * * * ?
  publish_schedule_status:
    description: PAUSED or UNPAUSED; the publish job can always be run on demand
    default: PAUSED

  # --- Daily batches sized by the review team (docs/setup-guide.md) ---
  enrichment_reviewers:
    description: Reviewers available for the daily batch; "0" turns the review-queue limit off (initial backfill)
    default: "1"
  enrichment_products_per_reviewer:
    description: Products one reviewer closes per day (approve or reject). 25 is the starting point; recalibrate with the throughput query of docs/setup-guide.md
    default: "25"
  enrichment_cron:
    description: Quartz cron expression of the enrichment batch (in timezone_id). Default 02:00 on weekdays, so the batch is ready in the morning
    default: 0 0 2 ? * MON-FRI
  enrichment_schedule_status:
    description: PAUSED or UNPAUSED. Paused by default; turn it on after the pilot (the job spends model tokens and Firecrawl credits)
    default: PAUSED

  # --- Research agent and evidence capture ---
  model_endpoint:
    description: Databricks Foundation Model API endpoint used by the research agent
    default: databricks-claude-sonnet-4-6
  # The Firecrawl key is read from the Unity Catalog secret secret_catalog.secret_schema.firecrawl_secret_key, created
  # by an admin (docs/setup-guide.md). The defaults place it in the working schema.
  secret_catalog:
    description: Catalog of the Unity Catalog secret holding the Firecrawl API key
    default: ${var.catalog}
  secret_schema:
    description: Schema of the Unity Catalog secret holding the Firecrawl API key
    default: ${var.schema}
  firecrawl_secret_key:
    description: Name of the Unity Catalog secret holding the Firecrawl API key
    default: firecrawl_api_key
  use_native_web_search:
    description: '"false" (default) discovers candidate sources with Firecrawl search (2 credits per query, same path in AWS, Azure and GCP); "true" uses system.ai.web_search, which is billed as Model Serving and is not available in every cloud'
    default: "false"
  firecrawl_concurrency:
    description: Maximum simultaneous Firecrawl requests in a run (searches, scrapes and focused captures). 2 on the free plan; raise it with a paid plan
    default: "2"
  firecrawl_mcp_url:
    description: Remote Firecrawl MCP endpoint; the API key is sent in the Authorization header, never in the URL
    default: https://mcp.firecrawl.dev/v2/mcp
  evidence_volume:
    description: Managed Volume for the screenshots and crops captured by the jobs (the app only reads it)
    default: brickfill_evidence
  manual_evidence_volume:
    description: Managed Volume for the screenshots reviewers upload in the app (the only Volume the app writes)
    default: brickfill_manual_evidence

  # --- Identities, access and operations (used by the prod target) ---
  job_service_principal:
    description: Application ID of the service principal that runs the jobs in production
    default: ""
  admins_group:
    description: Workspace group that manages the jobs, the schema (and its secrets) and the Lakebase project
    default: ""
  reviewers_group:
    description: Workspace group of catalog reviewers (view the jobs, use the app)
    default: ""
  alert_emails:
    description: E-mails notified when a job fails
    type: complex
    default: []

  # --- FinOps ---
  budget_policy_id:
    description: Serverless budget (usage) policy that tags the cost of jobs, app, Lakebase and synced tables. Empty = workspace default
    default: ""
  tag_cost_center:
    description: Cost center tag applied to every resource
    default: ""
  tag_owner:
    description: Owner tag (team or e-mail) applied to every resource
    default: ""
  tag_business_unit:
    description: Business unit tag applied to every resource
    default: ""

  # --- Job runtime: exact versions keep every run reproducible (keep in sync with pyproject.toml / uv.lock) ---
  job_dependencies:
    description: Python packages installed in the serverless environment of every job
    type: complex
    default:
      - databricks-sdk[openai]==0.143.0
      - mcp==1.30.0
      - httpx==0.28.1
      - Pillow==13.0.0
      - pydantic==2.13.5
      - tenacity==9.1.4
      - psycopg[binary]==3.3.6

targets:
  # Development. No workspace is pinned here: deploy with --profile <PROFILE> and set the workspace-specific values
  # with --var or in .databricks/bundle/dev/variable-overrides.json (gitignored), e.g.
  #   {"catalog": "<catalog>", "app_service_principal": "<app_sp_client_id>"}
  # The mock-data job (resources/dev_only.yml) writes a fictional ERP to adapter_source_schema; the mock adapter maps it.
  dev:
    default: true
    mode: development
    variables:
      tag_cost_center: dev

  # Production. Fill the variables below (or pass --var) and deploy with
  #   databricks bundle deploy -t prod --profile <PROFILE>
  # See docs/setup-guide.md. To add a staging environment, copy this target (and its blocks in
  # resources/prod_platform.yml) under another name.
  prod:
    mode: production
    # A single copy per environment, in the deploying identity's folder (ideally a CI service principal); only that
    # identity and the groups below can access it (unlike /Workspace/Shared).
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.job_service_principal}
    # Applied to every resource of the bundle (jobs, Lakebase project, deploy folder). Reviewers get CAN_VIEW only on
    # the jobs (resources/prod_platform.yml).
    permissions:
      - level: CAN_MANAGE
        group_name: ${var.admins_group}
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
    variables:
      publish_schedule_status: UNPAUSED
      # The Firecrawl key is the Unity Catalog secret <catalog>.<schema>.firecrawl_api_key (docs/setup-guide.md);
      # set secret_catalog/secret_schema/firecrawl_secret_key only if it lives elsewhere.
      # Required — fill for your workspace:
      # catalog: <working_catalog>
      # adapter: <your_adapter>                  # adapters/<your_adapter>/*.sql
      # adapter_source_catalog: <erp_catalog>
      # adapter_source_schema: <erp_schema>
      # content_language: en                     # en | pt-BR | es
      # market: US                               # BR | ES | MX | US | empty
      # timezone_id: America/New_York
      # lakebase_project_id: brickfill-prod
      # job_service_principal: <jobs_sp_application_id>
      # app_service_principal: <app_sp_client_id>   # after the first app deploy
      # admins_group: <admins_group>
      # reviewers_group: <reviewers_group>
      # alert_emails: [<email>]
      # budget_policy_id: <budget_policy_id>
      # tag_cost_center: <cost_center>
      # tag_owner: <owning_team>
      # tag_business_unit: <business_unit>
      # Daily batches (docs/setup-guide.md) — set after the pilot:
      # enrichment_reviewers: "<available_reviewers>"
      # enrichment_products_per_reviewer: "25"
      # enrichment_schedule_status: UNPAUSED

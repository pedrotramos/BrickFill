resources:
  jobs:
    brickfill_enrichment:
      name: BrickFill · Enrichment
      description: Enriches the next batch of products that fits in the review queue. Discovers sources with Firecrawl search (or system.ai.web_search when use_native_web_search is true), extracts and captures evidence with Firecrawl, writes the content with a Foundation Model API endpoint in the configured language, validates every value and loads the results to Lakebase for the review app.
      max_concurrent_runs: 1
      budget_policy_id: ${var.budget_policy_id}
      timeout_seconds: 43200
      email_notifications:
        on_failure: ${var.alert_emails}
        on_duration_warning_threshold_exceeded: ${var.alert_emails}
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 21600
      queue:
        enabled: true
      # Daily batch sized by the review team (docs/setup-guide.md). Paused until the pilot is approved: this is the
      # only job that spends model tokens and Firecrawl credits on its own.
      schedule:
        quartz_cron_expression: ${var.enrichment_cron}
        timezone_id: ${var.timezone_id}
        pause_status: ${var.enrichment_schedule_status}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: products_table
          default: ${var.source_catalog}.${var.source_schema}.${var.source_products_table}
        - name: attributes_table
          default: ${var.source_catalog}.${var.source_schema}.${var.source_attributes_table}
        - name: attribute_options_table
          default: ${var.source_catalog}.${var.source_schema}.${var.source_attribute_options_table}
        - name: attributes_required_default
          default: ${var.attributes_required_default}
        # Content settings; the app's Settings screen overrides them (globally or per category) at each batch.
        - name: content_language
          default: ${var.content_language}
        - name: catalog_language
          default: ${var.catalog_language}
        - name: content_profile
          default: ${var.content_profile}
        - name: market
          default: ${var.market}
        - name: model_endpoint
          default: ${var.model_endpoint}
        - name: secret_catalog
          default: ${var.secret_catalog}
        - name: secret_schema
          default: ${var.secret_schema}
        - name: firecrawl_secret_key
          default: ${var.firecrawl_secret_key}
        - name: firecrawl_mcp_url
          default: ${var.firecrawl_mcp_url}
        - name: use_native_web_search
          default: ${var.use_native_web_search}
        # New products per run = reviewers x products_per_reviewer minus the products still awaiting review in the
        # app, at most max_products (0 = no cap). reviewers = 0 turns the review-queue limit off (initial backfill).
        - name: reviewers
          default: ${var.enrichment_reviewers}
        - name: products_per_reviewer
          default: ${var.enrichment_products_per_reviewer}
        - name: max_products
          default: "0"
        - name: concurrency
          default: "2"
        - name: firecrawl_concurrency
          default: ${var.firecrawl_concurrency}
        # One GTIN or a list separated by ';' or ',': enriches exactly those (again, if they already were), ignoring
        # the review queue. Empty = the next batch of products never enriched.
        - name: ean
          default: ""
        - name: evidence_volume
          default: ${var.evidence_volume}
        - name: lakebase_endpoint
          default: ${var.lakebase_endpoint}
        - name: lakebase_database
          default: ${var.lakebase_database_name}
        - name: lakebase_results_schema
          default: ${var.lakebase_results_schema}
        - name: lakebase_schema
          default: ${var.lakebase_schema}
        - name: app_service_principal
          default: ${var.app_service_principal}

      tasks:
        - task_key: prepare
          description: Check the canonical views against the contract and normalize them into the governed Delta tables.
          notebook_task:
            notebook_path: ../notebooks/10_prepare.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              products_table: "{{job.parameters.products_table}}"
              attributes_table: "{{job.parameters.attributes_table}}"
              attribute_options_table: "{{job.parameters.attribute_options_table}}"
              attributes_required_default: "{{job.parameters.attributes_required_default}}"
          environment_key: default

        - task_key: enrich
          max_retries: 0
          description: Research and enrich each SKU with citations and deterministic validation, in the configured language.
          depends_on:
            - task_key: prepare
          notebook_task:
            notebook_path: ../notebooks/11_enrich.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              model_endpoint: "{{job.parameters.model_endpoint}}"
              secret_catalog: "{{job.parameters.secret_catalog}}"
              secret_schema: "{{job.parameters.secret_schema}}"
              firecrawl_secret_key: "{{job.parameters.firecrawl_secret_key}}"
              firecrawl_mcp_url: "{{job.parameters.firecrawl_mcp_url}}"
              use_native_web_search: "{{job.parameters.use_native_web_search}}"
              max_products: "{{job.parameters.max_products}}"
              concurrency: "{{job.parameters.concurrency}}"
              firecrawl_concurrency: "{{job.parameters.firecrawl_concurrency}}"
              ean: "{{job.parameters.ean}}"
              evidence_volume: "{{job.parameters.evidence_volume}}"
              reviewers: "{{job.parameters.reviewers}}"
              products_per_reviewer: "{{job.parameters.products_per_reviewer}}"
              lakebase_endpoint: "{{job.parameters.lakebase_endpoint}}"
              lakebase_database: "{{job.parameters.lakebase_database}}"
              lakebase_schema: "{{job.parameters.lakebase_schema}}"
              content_language: "{{job.parameters.content_language}}"
              catalog_language: "{{job.parameters.catalog_language}}"
              content_profile: "{{job.parameters.content_profile}}"
              market: "{{job.parameters.market}}"
          environment_key: default

        - task_key: load_lakebase
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: false
          description: Copy the products enriched by this run to Lakebase so the app reads them with Postgres latency.
          depends_on:
            - task_key: enrich
          notebook_task:
            notebook_path: ../notebooks/12_load_lakebase.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              lakebase_endpoint: "{{job.parameters.lakebase_endpoint}}"
              lakebase_database: "{{job.parameters.lakebase_database}}"
              lakebase_results_schema: "{{job.parameters.lakebase_results_schema}}"
              app_service_principal: "{{job.parameters.app_service_principal}}"
              load_scope: run
              run_id: "{{tasks.enrich.values.run_id}}"
          environment_key: default

      performance_target: STANDARD
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies: ${var.job_dependencies}

# Lakebase (Postgres) is the serving layer of the app in every target: the app keeps reviews, edits, manual evidence,
# settings and audit here, reads the catalog from a synced table of v_products, and the jobs load the latest
# enrichment and read the approvals and settings. Creating the project auto-provisions the "production" branch, the
# "primary" read-write endpoint and the databricks_postgres database.
resources:
  postgres_projects:
    brickfill:
      project_id: ${var.lakebase_project_id}
      display_name: BrickFill (${bundle.target})
      pg_version: 17
      budget_policy_id: ${var.budget_policy_id}
      custom_tags:
        - key: project
          value: brickfill
        - key: environment
          value: ${bundle.target}
        - key: cost_center
          value: ${var.tag_cost_center}
        - key: owner
          value: ${var.tag_owner}
        - key: business_unit
          value: ${var.tag_business_unit}
      # Compute endpoints created with the project (the "primary" one included) scale between lakebase_min_cu and
      # lakebase_max_cu with the load: a single reviewer runs on the minimum, more reviewers and the Lakebase load push
      # it up, and it never spends past the maximum. They suspend after 30 minutes without connections; the next
      # connection wakes them up. These are creation defaults: an existing endpoint keeps its range until resized
      # (docs/setup-guide.md).
      default_endpoint_settings:
        autoscaling_limit_min_cu: ${var.lakebase_min_cu}
        autoscaling_limit_max_cu: ${var.lakebase_max_cu}
        suspend_timeout_duration: 1800s
      purge_on_delete: false
      lifecycle:
        prevent_destroy: true

resources:
  jobs:
    brickfill_publish_approved:
      name: BrickFill · Publish approved
      description: Reads review decisions and human edits from Lakebase and merges the approved products into the destination Delta table.
      max_concurrent_runs: 1
      budget_policy_id: ${var.budget_policy_id}
      timeout_seconds: 3600
      email_notifications:
        on_failure: ${var.alert_emails}
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: ${var.publish_cron}
        timezone_id: ${var.timezone_id}
        pause_status: ${var.publish_schedule_status}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: lakebase_endpoint
          default: ${var.lakebase_endpoint}
        - name: lakebase_database
          default: ${var.lakebase_database_name}
        - name: lakebase_schema
          default: ${var.lakebase_schema}
        - name: destination_table
          default: ${var.destination_catalog}.${var.destination_schema}.${var.destination_table}

      tasks:
        - task_key: publish
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: false
          description: Merge APPROVED products (AI result plus active human edits) into the destination table.
          notebook_task:
            notebook_path: ../notebooks/20_publish_approved.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              lakebase_endpoint: "{{job.parameters.lakebase_endpoint}}"
              lakebase_database: "{{job.parameters.lakebase_database}}"
              lakebase_schema: "{{job.parameters.lakebase_schema}}"
              destination_table: "{{job.parameters.destination_table}}"
          environment_key: default

      performance_target: STANDARD
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies: ${var.job_dependencies}
